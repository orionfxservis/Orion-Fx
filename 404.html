  <title>404 - Page Not Found | Orion Fx</title>
  <meta name="description" content="The page you are looking for does not exist on Orion Fx." />
  <meta name="robots" content="noindex, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg: #030508;
      --card-bg: rgba(10, 15, 30, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #00E5FF;
      --accent: #7B61FF;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .glow-circle {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.15) 0%, rgba(123, 97, 255, 0.05) 50%, transparent 70%);
      filter: blur(40px);
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 229, 255, 0.1);
    }
    .badge {
      display: inline-block;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(0, 229, 255, 0.1);
      color: var(--primary);
      border: 1px solid rgba(0, 229, 255, 0.25);
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 30%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #030508;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 14px;
      padding: 13px 26px;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 229, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="glow-circle"></div>
  <div class="card">
    <div class="badge">Error 404</div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for doesn't exist or has moved. Return to Orion Fx to explore our applications and tools.</p>
    <a href="https://www.orionfx.net/" class="btn">
      Back to Homepage &rarr;
    </a>
  </div>
</body>
</html>
